<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>OpenStreamBot Inspector</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            background-color: #2d2d2d;
            font-size: 13px;
            padding: 10px;
        }
        .sdpi-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .sdpi-item-label {
            width: 80px;
            text-align: right;
            margin-right: 10px;
        }
        .sdpi-item-value {
            flex: 1;
        }
        input[type="text"] {
            width: 100%;
            background-color: #3d3d3d;
            color: white;
            border: 1px solid #555;
            padding: 5px;
            border-radius: 3px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #0078D7;
        }
    </style>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <div class="sdpi-item-label">Aktion Name</div>
            <div class="sdpi-item-value">
                <input class="sdpi-item-value" id="actionName" type="text" value="" placeholder="Name in OpenStreamBot">
            </div>
        </div>
        <div style="font-size: 11px; color: #aaa; margin-top: 10px; text-align: center;">
            Trage hier den exakten Namen der Aktion ein, wie er im OpenStreamBot definiert ist.
        </div>
    </div>
    
    <script src="inspector.js"></script>
</body>
</html>
