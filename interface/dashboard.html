<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenStreamBot Control Center</title>
    <link rel="stylesheet" href="style.css?v=0.6.4">
</head>

<body>

    <header>
        <div style="display:flex; align-items:center; gap: 10px;">
            <div id="status" title="Verbindungsstatus"></div>
            <img src="../assets/logo.png" alt="OpenStreamBot" style="width: 32px; height: 32px;">
            <h1>OpenStreamBot</h1>
            <div id="queue-status-badge" style="display:none; background: #D97706; color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; margin-left: 8px; box-shadow: 0 0 8px rgba(217, 119, 6, 0.4);"></div>
        </div>
        <div style="display:flex; align-items:center; gap: 15px;">
            <button onclick="triggerTestShort()" class="btn-yt" style="background: #2563EB;" title="Zufälligen Short im Overlay testen">📱 Test Short</button>
            <button onclick="startYouTubeStream()" class="btn-yt" title="YouTube Stream-Suche starten">▶ YouTube Start</button>
            <button onclick="toggleSettings()"
                style="background:none; border:none; color:white; cursor:pointer; font-size: 1.2em;">⚙️</button>
        </div>
    </header>

    <div id="connection-panel" style="display:none; padding: 10px; background: #3a1c1c; text-align: center;">
        <span style="margin-right: 10px; font-size: 0.9em;">Verbindung verloren.</span>
        <button onclick="connect()" class="btn-primary">Verbinden</button>
    </div>

    <div id="settings-panel">
        <label>Schriftgröße: <span id="font-val">14px</span></label>
        <input type="range" id="font-slider" min="10" max="30" value="14">
    </div>

    <div id="chat-container">
    </div>

    <div id="input-container">
        <input type="text" id="chat-input" placeholder="Nachricht senden..." autocomplete="off">
        <button onclick="sendMessage()" id="send-btn">➤</button>
    </div>

    <script src="app.js?v=0.6.4"></script>
</body>

</html>
