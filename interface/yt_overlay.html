<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>OpenStreamBot YouTube Overlay</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            width: 100%;
            height: 100%;
        }

        #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }

        #player.active {
            opacity: 1;
            pointer-events: auto;
        }

        #debug {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
            z-index: 10;
            display: none;
            pointer-events: none;
            /* Hidden by default, can toggle if needed */
        }

        #status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 18px;
            background: rgba(18, 18, 18, 0.9);
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            z-index: 100;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="status-badge">⏳ Warte auf OpenStreamBot...</div>
    <div id="debug">Overlay Ready. Waiting for WS...</div>
    <div id="player"></div>

    <script>
        let badgeTimer = null;
        let badgeFadeTimer = null;
        function showStatusBadge(text, borderColor, autoFade = true) {
            const badge = document.getElementById('status-badge');
            if (!badge) return;
            if (badgeTimer) clearTimeout(badgeTimer);
            if (badgeFadeTimer) clearTimeout(badgeFadeTimer);
            badge.innerHTML = text;
            badge.style.borderColor = borderColor;
            badge.style.opacity = '1';
            badge.style.display = 'block';
            if (autoFade) {
                badgeTimer = setTimeout(() => {
                    badge.style.opacity = '0';
                    badgeFadeTimer = setTimeout(() => { badge.style.display = 'none'; }, 800);
                }, 4000);
            }
        }

        function log(msg) {
            const d = document.getElementById('debug');
            if (d) {
                d.innerHTML += "<div>" + msg + "</div>";
                if (d.childElementCount > 10) d.removeChild(d.firstChild);
            }
            console.log(msg);
        }

        // 1. YouTube IFrame API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var queue = [];
        var isPlaying = false;
        var playerReady = false;
        var progressTimer = null;
        var safetyTimer = null;
        var lastReportedTime = -1;

        function onYouTubeIframeAPIReady() {
            log("YT API Ready. Creating Player...");
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: '',
                host: 'https://www.youtube-nocookie.com',
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'rel': 0,
                    'autoplay': 1,
                    'mute': 0,
                    'enablejsapi': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            log("Player Ready Event.");
            playerReady = true;
            try {
                if (player && typeof player.getIframe === 'function') {
                    const iframe = player.getIframe();
                    if (iframe) {
                        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
                        iframe.setAttribute('allowfullscreen', '1');
                    }
                }
            } catch (e) {}
            if (queue.length > 0 && !isPlaying) {
                playNext();
            }
        }

        function onPlayerError(event) {
            log("Player Error: " + event.data);
            // If an error happens while a video is supposed to play, finish so backend un-ducks
            if (isPlaying) {
                log("Error during playback (Code " + event.data + "), finishing video.");
                finishVideo();
            }
        }

        function finishVideo() {
            if (!isPlaying) return;
            log("Video Finished. Hiding and notifying backend.");
            isPlaying = false;

            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
            if (safetyTimer) {
                clearTimeout(safetyTimer);
                safetyTimer = null;
            }
            lastReportedTime = -1;

            try {
                if (player && typeof player.stopVideo === 'function') {
                    player.stopVideo();
                }
            } catch (e) {
                log("Error stopping player: " + e);
            }

            const playerEl = document.getElementById('player');
            if (playerEl) {
                playerEl.classList.remove('active');
                playerEl.style.opacity = '0';
                playerEl.style.pointerEvents = 'none';
            }

            // Notify Bot backend that video has ended (restores audio ducking)
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ event: "YouTubeEnded", data: {} }));
            }

            // Play next video after a brief pause if queued
            if (queue.length > 0) {
                setTimeout(playNext, 1000);
            }
        }

        function startPlaybackMonitor() {
            if (progressTimer) clearInterval(progressTimer);
            lastReportedTime = -1;

            progressTimer = setInterval(() => {
                if (!player || !isPlaying) {
                    if (progressTimer) clearInterval(progressTimer);
                    return;
                }

                try {
                    const currentTime = player.getCurrentTime();
                    const duration = player.getDuration();

                    if (duration > 2.0 && currentTime >= 0) {
                        // 1. Reached end of video (standard finish)
                        if (currentTime >= duration - 0.5) {
                            log("Monitor: Reached end of video (" + currentTime.toFixed(1) + "/" + duration.toFixed(1) + "s)");
                            finishVideo();
                            return;
                        }

                        // 2. Loop detection: YouTube Shorts looping back to 0
                        if (lastReportedTime > (duration * 0.7) && currentTime < 2.0) {
                            log("Monitor: Detected loop restart! Ending Short now.");
                            finishVideo();
                            return;
                        }

                        lastReportedTime = currentTime;
                    }
                } catch (e) {
                    // Player might not be ready yet
                }
            }, 250);
        }

        function onPlayerStateChange(event) {
            var stateNames = { 0: "ENDED", 1: "PLAYING", 2: "PAUSED", 3: "BUFFERING", 5: "CUED" };
            var stateName = stateNames[event.data] || event.data;
            log("State Change: " + stateName);

            if (event.data === YT.PlayerState.ENDED) {
                log("Video Ended event received.");
                finishVideo();
            } else if (event.data === YT.PlayerState.PLAYING) {
                log("Video Playing.");
                showStatusBadge("▶ Wiedergabe läuft", "#10B981", true);
                const playerEl = document.getElementById('player');
                if (playerEl) {
                    playerEl.classList.add('active');
                    playerEl.style.opacity = '1';
                    playerEl.style.pointerEvents = 'auto';
                }
                isPlaying = true;
                startPlaybackMonitor();

                // Safety fallback timeout based on video duration
                try {
                    const dur = player.getDuration();
                    if (dur > 2.0) {
                        if (safetyTimer) clearTimeout(safetyTimer);
                        safetyTimer = setTimeout(() => {
                            log("Safety timer expired (" + dur + "s). Finishing video.");
                            finishVideo();
                        }, (dur + 3) * 1000);
                    }
                } catch (e) {}
            } else if (event.data === YT.PlayerState.PAUSED && isPlaying) {
                // If it paused near the end
                try {
                    const cur = player.getCurrentTime();
                    const dur = player.getDuration();
                    if (dur > 2.0 && cur >= dur - 0.5) {
                        finishVideo();
                    }
                } catch (e) {}
            }
        }

        function playNext() {
            if (!playerReady || !player) {
                log("Play requested but player not ready.");
                return;
            }
            if (queue.length === 0) return;

            var vidId = queue.shift();
            log("Playing ID: " + vidId);

            // Unmute and volume
            try { player.unMute(); } catch (e) { }
            try { player.setVolume(100); } catch (e) { }

            const playerEl = document.getElementById('player');
            if (playerEl) {
                playerEl.classList.add('active');
                playerEl.style.opacity = '1';
                playerEl.style.pointerEvents = 'auto';
            }
            player.loadVideoById(vidId);
            isPlaying = true;
        }

        // 2. WebSocket Connection (reconnects cleanly without reloading the HTML page)
        let ws = null;
        let reconnectTimer = null;

        function connectWebSocket() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            try {
                const host = window.location.hostname || "localhost";
                ws = new WebSocket(`ws://${host}:8080`);

                ws.onopen = () => {
                    log("WS Connected.");
                    showStatusBadge(`🟢 OpenStreamBot Overlay bereit (ws://${host}:8080)`, "#10B981", true);
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.event === "YouTubePlay") {
                            log("Received YouTubePlay: " + msg.data.videoId);
                            showStatusBadge("⏳ Video wird geladen...", "#3B82F6", true);
                            queue.push(msg.data.videoId);
                            if (!isPlaying) {
                                playNext();
                            }
                        } else if (msg.event === "YouTubeStop") {
                            log("Received YouTubeStop.");
                            queue = [];
                            finishVideo();
                        }
                    } catch (e) {
                        log("WS Error: " + e.message);
                    }
                };

                ws.onclose = () => {
                    log("WS Disconnected. Reconnecting in 3s...");
                    showStatusBadge("🔴 Verbindung getrennt (Warte auf Bot...)", "#EF4444", false);
                    reconnectTimer = setTimeout(connectWebSocket, 3000);
                };

                ws.onerror = (e) => {
                    // onclose handles the reconnect
                };
            } catch (err) {
                reconnectTimer = setTimeout(connectWebSocket, 3000);
            }
        }

        connectWebSocket();

        // Taste 'T' drücken zum manuellen Testen eines Clips im Browser
        window.addEventListener('keydown', (e) => {
            if ((e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.altKey) {
                log("Manuelles Testvideo ausgelöst (Taste T)");
                showStatusBadge("▶ Test-Clip wird abgespielt...", "#3B82F6", true);
                queue.push("1PtxtqU6wZ4");
                if (!isPlaying) playNext();
            }
        });
    </script>
</body>

</html>
